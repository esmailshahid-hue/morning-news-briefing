name: Daily briefing

on:
  schedule:
    # 00:30 UTC = 05:30 Pakistan time, every day.
    # Pakistan is UTC+5, so subtract 5 hours from the time you want.
    # Format: "minute hour * * *"   e.g. 06:15 PKT -> "15 1 * * *"
    - cron: "30 0 * * *"
  workflow_dispatch: {}   # adds the "Run workflow" button

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Load previous episodes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
            rm -rf site/.git
          else
            echo "First run: no website yet."
            mkdir -p site
          fi

      - name: Make today's briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: python briefing.py --site-dir site

      - name: Publish to the podcast website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Briefing $(date -u +%Y-%m-%d)"
          # Replaces the website branch each day so old audio never piles up.
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Keep the daily schedule switched on
        # GitHub pauses schedules after 60 days with no activity on the repository.
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ($(date +%s) - last) / 86400 ))
          if [ "$age_days" -ge 30 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%Y-%m-%dT%H:%M:%SZ > .last-keepalive
            git add .last-keepalive
            git commit -q -m "Keep the daily schedule active"
            git pull -q --rebase && git push -q
          else
            echo "Recent activity ${age_days} days ago; nothing to do."
          fi
